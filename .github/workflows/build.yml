name: Build

on:
    push:
        branches: [main]
        paths: ['src/**', 'Makefile', '.github/workflows/build.yml']
    pull_request:
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Show toolchain
              run: gcc --version

            - name: Build
              run: make build
